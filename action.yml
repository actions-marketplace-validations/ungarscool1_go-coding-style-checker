name: Go coding style checker
description: Enforce Go line width, file length, nesting depth, branch, parameter, and return budgets
branding:
  icon: check-square
  color: blue

inputs:
  root:
    description: Repository root to scan
    default: .
  baseline:
    description: Backlog file to enforce. Defaults to stylecheck-baseline.txt in the root
    default: ''
  exclude:
    description: Comma-separated directories to skip, relative to the root
    default: ''
  go-version:
    description: Go used to build and parse. Empty uses the Go already on PATH
    default: stable

runs:
  using: composite
  steps:
    - name: Set up Go
      if: inputs.go-version != ''
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Build the checker
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GOFLAGS: ''
        GOTOOLCHAIN: auto
        GOWORK: 'off'
      run: go build -o "$RUNNER_TEMP/stylecheck" .

    - name: Check style budgets
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        BASELINE: ${{ inputs.baseline }}
        EXCLUDE: ${{ inputs.exclude }}
      run: '"$RUNNER_TEMP/stylecheck" -root "$ROOT" -baseline "$BASELINE" -exclude "$EXCLUDE"'
